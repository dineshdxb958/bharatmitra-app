<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatMitra AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B1220; --card:#12192B; --line:#25324A; --ink:#F2F5FA; --ink-soft:#8B96AC;
    --trust-1:#123A73; --trust-2:#1F5AAE; --trust-3:#3E82D6; --gold:#E8B23D; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); min-height:100%; }
  .wrap{ max-width:420px; margin:0 auto; padding:28px 22px 50px; }
  .topbar{ display:flex; justify-content:flex-end; margin-bottom:18px; }
  select#langSelect{ background:var(--card); color:var(--ink); border:1px solid var(--line); font-size:13px;
    font-weight:600; padding:8px 10px; border-radius:10px; }
  select#langSelect option{ background:var(--card); color:var(--ink); font-size:14px; padding:10px; }
  .header{ text-align:center; margin-bottom:24px; }
  .logo{ width:64px; height:64px; border-radius:16px; margin:0 auto 14px; overflow:hidden; }
  .logo img{ width:100%; height:100%; object-fit:cover; }
  h1{ font-family:'Manrope',sans-serif; font-size:20px; margin:0 0 6px; }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .msg{ font-size:12.5px; border-radius:10px; padding:10px 12px; margin-bottom:14px; display:none; }
  .msg.err{ background:#3A1414; color:#FF9B9B; border:1px solid #5A2020; }
  .msg.ok{ background:#123A2E; color:#7FE0B8; border:1px solid #1E5C46; }
  .msg.show{ display:block; }
  label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin:14px 0 6px; }
  .row{ display:flex; justify-content:space-between; align-items:center; }
  input[type=text],input[type=email],input[type=password],input[type=number]{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:13px 14px; font-size:14px; font-family:'Inter',sans-serif; }
  .pwrow{ position:relative; }
  .pwrow input{ padding-right:44px; }
  .eyebtn{ position:absolute; right:6px; top:6px; bottom:6px; width:36px; background:none; border:none; color:var(--ink-soft); font-size:16px; }
  a.link, button.linklike{ color:var(--gold); font-weight:700; font-size:12.5px; text-decoration:none; background:none; border:none; padding:0; font-family:'Inter',sans-serif; }
  .primary{ width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px; color:#fff; font-weight:800; font-size:15px;
    background:#1F5AAE; }
  .divider{ text-align:center; color:var(--ink-soft); font-size:12px; margin:18px 0; }
  .google{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:#fff; color:#222;
    border:none; border-radius:12px; padding:13px 0; font-weight:700; font-size:14px; }
  .switch{ text-align:center; margin-top:18px; font-size:12.5px; color:var(--ink-soft); }
  .hidden{ display:none; }
  .checkrow{ display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:11.5px; color:var(--ink-soft); }
  .checkrow input{ margin-top:2px; }
  .trust{ margin-top:24px; background:#0F2A20; border:1px solid #1E5C46; border-radius:12px; padding:12px 14px; font-size:11.5px; color:#B5E8CE; }
  .home{ text-align:center; }
  .avatar{ width:76px; height:76px; border-radius:50%; background:var(--trust-2); margin:20px auto 12px; display:flex;
    align-items:center; justify-content:center; color:#fff; font-size:26px; font-weight:800; font-family:'Manrope',sans-serif; overflow:hidden; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .logout{ width:100%; margin-top:24px; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:#FF9B9B; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <select id="langSelect" onchange="applyLang(this.value)">
      <option value="hi">🌐 हिंदी</option>
      <option value="en">🌐 English</option>
      <option value="or">🌐 ଓଡ଼ିଆ</option>
      <option value="ta">🌐 தமிழ்</option>
      <option value="te">🌐 తెలుగు</option>
      <option value="kn">🌐 ಕನ್ನಡ</option>
      <option value="bn">🌐 বাংলা</option>
    </select>
  </div>

  <div id="authView">
    <div class="header">
      <div class="logo"><img src="logo.png"></div>
      <h1 id="formTitle" data-i18n="welcomeTitle">BharatMitra AI me Swagat</h1>
      <p class="sub" data-i18n="subtitle">Business, documents aur zyada — ek jagah</p>
    </div>

    <div class="msg err" id="errBox"></div>
    <div class="msg ok" id="okBox"></div>

    <div id="mainForm">
      <div class="reg-only hidden">
        <label data-i18n="nameLabel">Full Name</label>
        <input type="text" id="nameInput" placeholder="Ramesh Kumar">
      </div>

      <label data-i18n="emailLabel">Email Address</label>
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">

      <div class="row">
        <label style="margin:14px 0 6px" data-i18n="passwordLabel">Password</label>
        <button type="button" class="linklike login-only" onclick="showForgot()" data-i18n="forgotPassword">Password bhool gaye?</button>
      </div>
      <div class="pwrow">
        <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="eyebtn" onclick="togglePw()">👁</button>
      </div>

      <div class="reg-only hidden">
        <label data-i18n="ageLabel">Age</label>
        <input type="number" id="ageInput" placeholder="25">
        <label><span data-i18n="referralLabel">Referral Code</span> (Optional)</label>
        <input type="text" id="referralInput" placeholder="VGGG2026">
        <div class="checkrow">
          <input type="checkbox" id="consentCheck">
          <label for="consentCheck" id="consentLabelEl" style="margin:0">Main <a class="link" href="privacy-policy.html" target="_blank">Privacy Policy</a> aur <a class="link" href="terms.html" target="_blank">Terms</a> se sehmat hoon</label>
        </div>
      </div>

      <button type="button" class="primary" id="primaryBtn" onclick="handleEmailAuth()" data-i18n="continueEmailBtn">Continue with Email</button>
      <div class="divider" data-i18n="orContinue">Ya isse jaari rakhein</div>
      <button type="button" class="google" onclick="handleGoogleAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.07-1.4-.2-2H12v3.9h5.9c-.1.9-.8 2.3-2.3 3.3l-.02.15 3.35 2.6.23.02c2.13-1.97 3.35-4.87 3.35-7.97z"/><path fill="#34A853" d="M12 23c3.02 0 5.55-1 7.4-2.7l-3.55-2.75c-.95.66-2.23 1.13-3.85 1.13-2.95 0-5.45-1.98-6.35-4.65l-.14.01-3.5 2.7-.05.13C3.87 20.5 7.63 23 12 23z"/><path fill="#FBBC05" d="M5.65 14.03A6.9 6.9 0 0 1 5.25 12c0-.7.13-1.4.38-2.03l-.01-.14L2.08 7.08l-.12.06A11 11 0 0 0 1 12c0 1.77.43 3.44 1.18 4.9z"/><path fill="#EA4335" d="M12 5.38c2.1 0 3.5.9 4.3 1.65l3.15-3.07C17.53 2.1 15.02 1 12 1 7.63 1 3.87 3.5 2.08 7.08l3.57 2.77c.9-2.67 3.4-4.47 6.35-4.47z"/></svg>
        <span data-i18n="googleBtn">Google se Continue</span>
      </button>
      <div class="switch" id="switchMode"><span data-i18n="noAccount">Account nahi hai?</span> <button type="button" class="linklike" onclick="toggleMode()" data-i18n="registerLink">Register karein</button></div>

      <div class="trust" style="display:flex; align-items:center; gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M12 2L20 6V12C20 17 16.5 20.5 12 22C7.5 20.5 4 17 4 12V6L12 2Z" stroke="#7FE0B8" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#7FE0B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="trustText">100% Surakshit aur Bharosemand — aapka data hamare saath surakshit hai</span>
      </div>
    </div>

    <div id="forgotPanel" class="hidden">
      <button type="button" class="linklike" onclick="hideForgot()">← Wapas</button>
      <label data-i18n="emailLabel">Email Address</label>
      <input type="email" id="forgotEmailInput" placeholder="you@example.com">
      <button type="button" class="primary" onclick="handleForgotSubmit()" data-i18n="resetBtn">Reset Link Bhejein</button>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:11px; color:var(--ink-soft);">
      <a class="link" href="privacy-policy.html" target="_blank">Privacy Policy</a> &nbsp;·&nbsp; <a class="link" href="terms.html" target="_blank">Terms of Service</a>
    </div>
  </div>

  <div id="homeView" class="hidden home">
    <div class="avatar" id="hAvatar">V</div>
    <h1 id="hName" style="font-size:17px">—</h1>
    <p class="sub" id="hEmail">—</p>
    <div class="trust" style="display:flex; align-items:center; gap:10px; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M12 2L20 6V12C20 17 16.5 20.5 12 22C7.5 20.5 4 17 4 12V6L12 2Z" stroke="#7FE0B8" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#7FE0B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="loginSuccess">Login Successful</span>
    </div>
    <button type="button" class="logout" onclick="handleLogout()" data-i18n="logoutBtn">Logout</button>
  </div>
</div>

  function applyLang(code){
    currentLang = code;
    const t = i18n[code];
    document.querySelectorAll('[data-i18n]').forEach(function(el){ if (t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n]; });
    document.getElementById('formTitle').textContent = isRegisterMode ? t.registerTitle : t.welcomeTitle;
    document.getElementById('primaryBtn').textContent = isRegisterMode ? t.registerBtn : t.continueEmailBtn;
    document.getElementById('switchMode').innerHTML = isRegisterMode
      ? '<span>' + t.haveAccount + '</span> <button type="button" class="linklike" onclick="toggleMode()">' + t.loginLink + '</button>'
      : '<span>' + t.noAccount + '</span> <button type="button" class="linklike" onclick="toggleMode()">' + t.registerLink + '</button>';
  }

  function togglePw(){
    const inp = document.getElementById('passInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function toggleMode(){
    isRegisterMode = !isRegisterMode;
    document.querySelectorAll('.reg-only').forEach(function(el){ el.classList.toggle('hidden', !isRegisterMode); });
    document.querySelectorAll('.login-only').forEach(function(el){ el.classList.toggle('hidden', isRegisterMode); });
    document.getElementById('errBox').classList.remove('show');
    document.getElementById('okBox').classList.remove('show');
    applyLang(currentLang);
  }

  function showError(msg){ const b=document.getElementById('errBox'); b.textContent=msg; b.classList.add('show'); document.getElementById('okBox').classList.remove('show'); }
  function showOk(msg){ const b=document.getElementById('okBox'); b.textContent=msg; b.classList.add('show'); document.getElementById('errBox').classList.remove('show'); }

  function showForgot(){ document.getElementById('mainForm').classList.add('hidden'); document.getElementById('forgotPanel').classList.remove('hidden'); }
  function hideForgot(){ document.getElementById('mainForm').classList.remove('hidden'); document.getElementById('forgotPanel').classList.add('hidden'); }

  function friendlyError(code){
    const map = { 'auth/email-already-in-use':'Ye email pehle se registered hai', 'auth/invalid-credential':'Email ya Password galat hai',
      'auth/user-not-found':'Account nahi mila', 'auth/wrong-password':'Password galat hai', 'auth/invalid-email':'Sahi email dalein',
      'auth/popup-closed-by-user':'Google popup band ho gaya' };
    return map[code] || ('Error: ' + code);
  }

  async function initFirebase(){
    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js");
      fb = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js");
      const app = appMod.initializeApp(firebaseConfig);
      auth = fb.getAuth(app);
      provider = new fb.GoogleAuthProvider();
      firebaseReady = true;
      fb.onAuthStateChanged(auth, function(user){
        if (user) {
          document.getElementById('authView').classList.add('hidden');
          document.getElementById('homeView').classList.remove('hidden');
          document.getElementById('hName').textContent = user.displayName || 'Vggg';
          document.getElementById('hEmail').textContent = user.email || '';
          if (user.photoURL) document.getElementById('hAvatar').innerHTML = '<img src="'+user.photoURL+'">';
          else document.getElementById('hAvatar').textContent = (user.displayName || user.email || 'V')[0].toUpperCase();
        } else {
          document.getElementById('homeView').classList.add('hidden');
          document.getElementById('authView').classList.remove('hidden');
        }
      });
    } catch (e) { console.error('Firebase failed', e); }
  }
  initFirebase();

  async function handleEmailAuth(){
    if (!firebaseReady) { showError(i18n[currentLang].netErr); return; }
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value;
    if (!email || !pass) { showError('Email aur Password dono bharein'); return; }
    if (pass.length < 6) { showError('Password kam se kam 6 characters ka ho'); return; }
    try {
      if (isRegisterMode) {
        if (!document.getElementById('consentCheck').checked) { showError('Privacy Policy accept karna zaroori hai'); return; }
        const name = document.getElementById('nameInput').value.trim();
        const cred = await fb.createUserWithEmailAndPassword(auth, email, pass);
        if (name) await fb.updateProfile(cred.user, { displayName: name });
      } else { await fb.signInWithEmailAndPassword(auth, email, pass); }
    } catch (e) { showError(friendlyError(e.code)); }
  }
  async function handleGoogleAuth(){
    if (!firebaseReady) { showError(i18n[currentLang].netErr); return; }
    try { await fb.signInWithPopup(auth, provider); } catch (e) { showError(friendlyError(e.code)); }
  }
  async function handleLogout(){ if (firebaseReady) await fb.signOut(auth); }
  async function handleForgotSubmit(){
    if (!firebaseReady) { showError(i18n[currentLang].netErr); return; }
    const email = document.getElementById('forgotEmailInput').value.trim();
    if (!email) { showError('Email dalein'); return; }
    try { await fb.sendPasswordResetEmail(auth, email); showOk(i18n[currentLang].resetSent); }
    catch (e) { showError(friendlyError(e.code)); }
  }

  applyLang('hi');
</script>
</body>
</html>
